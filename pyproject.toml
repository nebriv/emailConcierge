[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-concierge"
version = "0.1.0"
description = "Self-hosted IMAP-to-CalDAV event extractor with tiered deterministic/ML/LLM pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "emailConcierge contributors" }]
dependencies = [
    "imap-tools>=1.7",
    "icalendar>=5.0",
    "caldav>=1.3",
    "openai>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "selectolax>=0.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
email-concierge = "email_concierge.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["email_concierge*"]

[tool.setuptools.package-data]
email_concierge = ["prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"imap_tools".msg = "IMAP access must go through email_concierge.imap_readonly. Import from there instead."
"imap_tools.mailbox".msg = "IMAP access must go through email_concierge.imap_readonly."
"imap_tools.query".msg = "IMAP access must go through email_concierge.imap_readonly."

[tool.ruff.lint.per-file-ignores]
"email_concierge/imap_readonly.py" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in integration tests requiring external services (set EMAIL_CONCIERGE_INTEGRATION=1)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
