[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-concierge"
version = "0.1.0"
description = "Self-hosted IMAP-to-CalDAV event extractor with tiered deterministic/ML/LLM pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "emailConcierge contributors" }]
dependencies = [
    "imap-tools>=1.7",
    "icalendar>=5.0",
    "caldav>=1.3",
    "openai>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "selectolax>=0.3",
    "tzdata>=2024.1",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.120",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
plid-resolver = [
    # One-off Google Calendar training-data pairing: resolves web-UI
    # `plid=` permalink tokens to REST-addressable Gmail thread IDs
    # by loading them in an authenticated Chrome session. Only used
    # by the `import-training --resolve-plids` path — not a runtime
    # dependency of the live listener.
    "selenium>=4.10",
    "undetected-chromedriver>=3.5",
]
ml = [
    # Stage 3: classifier gate + zero-shot NER. Pulls in torch transitively
    # (~1GB on disk); users who only want Stage 1 (ICS) + Stage 4 (LLM)
    # can skip this extras group. Stage 3 gracefully degrades to disabled
    # when the imports fail — see extractors/ner.py.
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "gliner>=0.2",
    "numpy>=1.26",
]

[project.scripts]
email-concierge = "email_concierge.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["email_concierge*"]

[tool.setuptools.package-data]
email_concierge = ["prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"imap_tools".msg = "IMAP access must go through email_concierge.imap_readonly. Import from there instead."
"imap_tools.mailbox".msg = "IMAP access must go through email_concierge.imap_readonly."
"imap_tools.query".msg = "IMAP access must go through email_concierge.imap_readonly."
"googleapiclient".msg = "Google API access must go through email_concierge.integrations.google.*"
"googleapiclient.discovery".msg = "Google API access must go through email_concierge.integrations.google.*"
"googleapiclient.errors".msg = "Google API access must go through email_concierge.integrations.google.*"
"google_auth_oauthlib".msg = "Google auth must go through email_concierge.integrations.google.auth."
"google_auth_oauthlib.flow".msg = "Google auth must go through email_concierge.integrations.google.auth."
"google.oauth2".msg = "Google auth must go through email_concierge.integrations.google.auth."
"google.oauth2.credentials".msg = "Google auth must go through email_concierge.integrations.google.auth."
"google.auth.transport.requests".msg = "Google auth must go through email_concierge.integrations.google.auth."
"selenium".msg = "Browser automation must stay in email_concierge.integrations.google.plid_resolver."
"selenium.webdriver".msg = "Browser automation must stay in email_concierge.integrations.google.plid_resolver."
"undetected_chromedriver".msg = "Browser automation must stay in email_concierge.integrations.google.plid_resolver."

[tool.ruff.lint.per-file-ignores]
"email_concierge/imap_readonly.py" = ["TID251"]
"email_concierge/integrations/google/auth.py" = ["TID251"]
"email_concierge/integrations/google/calendar.py" = ["TID251"]
"email_concierge/integrations/google/gmail.py" = ["TID251"]
"email_concierge/integrations/google/plid_resolver.py" = ["TID251"]
"tests/test_google_auth.py" = ["TID251"]
"tests/test_google_calendar.py" = ["TID251"]
"tests/test_google_gmail.py" = ["TID251"]
"tests/test_import_training.py" = ["TID251"]
"tests/test_plid_resolver.py" = ["TID251"]
"scripts/plid_spike.py" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in integration tests requiring external services (set EMAIL_CONCIERGE_INTEGRATION=1)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
