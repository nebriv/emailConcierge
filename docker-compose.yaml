services:
  email-concierge:
    build: .
    image: email-concierge:local
    container_name: email-concierge
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # EMAIL_CONCIERGE_LLM_BASE_URL in .env can point at any OpenAI-compatible
    # endpoint: a local/host-mode Ollama, RunPod serverless vLLM, OpenRouter,
    # etc. See README for the RunPod setup. No service dependency is declared
    # here because the LLM is often external to this compose file.
