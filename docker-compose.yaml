services:
  email-concierge:
    # Pull the published image by default; flip to `build: .` (and comment
    # the image line) if you want to iterate locally.
    #image: ${EMAIL_CONCIERGE_IMAGE:-ghcr.io/nebriv/emailconcierge:latest}
    build: .
    container_name: email-concierge
    restart: unless-stopped
    env_file: .env
    # Pin container-local paths. Takes precedence over .env so that a
    # host-mode dev setup (where the repo root is the CWD and
    # `./data/...` makes sense) doesn't bleed into the container (where
    # CWD is /app and the `concierge` user can only write under /data).
    environment:
      EMAIL_CONCIERGE_DB_PATH: /data/email-concierge.db
      EMAIL_CONCIERGE_MODELS_DIR: /data/models
    volumes:
      - ./data:/data

    # Allocate a pseudo-TTY and keep stdin open so the container's default
    # entrypoint drops into the interactive shell (REPL + listener thread
    # in one process). Without these the shell detects no-TTY and falls
    # back to foreground listener — also valid, just not interactive.
    tty: true
    stdin_open: true

    # Usage:
    #   docker compose up -d           # start in background
    #   docker attach email-concierge  # get the REPL
    #     (Ctrl-P Ctrl-Q to detach without stopping the container)
    #   docker compose down            # stop everything
    #
    # NOTE: `docker compose up` (attached, no -d) shows the container's
    # stdout but does NOT reliably forward keystrokes into the REPL,
    # especially on Windows / PowerShell. Always use `up -d` + `attach`
    # for interactive use. Log streaming alone: `docker compose logs -f`.
    #
    #   At the `emc>` prompt:
    #     status                       # listener state + DB counters
    #     watch --follow --ids         # stream recent activity
    #     mark-event '<id@host>'       # fix a false negative
    #     forget <uid> --delete-remote # delete without training on it
    #     train classifier --dry-run
    #     evaluate --sample=200
    #     feedback
    #     listener restart             # without leaving the shell
    #     help / help <cmd> / exit
    #
    # EMAIL_CONCIERGE_LLM_BASE_URL in .env can point at any OpenAI-compatible
    # endpoint: a local/host-mode Ollama, RunPod serverless vLLM, OpenRouter,
    # etc. No service dependency is declared here because the LLM is often
    # external to this compose file.
