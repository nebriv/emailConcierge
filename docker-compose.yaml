services:
  email-concierge:
    build: .
    image: email-concierge:local
    container_name: email-concierge
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # If you run Ollama in a different compose file / on the host, make sure
    # EMAIL_CONCIERGE_LLM_BASE_URL in .env points to a reachable URL. For
    # host-mode Ollama on Docker Desktop, `host.docker.internal:11434` works.
